name: Painel AgroClima diário

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT (09:00 UTC) — após o dado do INMET entrar
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar no site (false = dry-run, só gera o HTML)'
        type: boolean
        default: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Gerar painel
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_AUTH:           ${{ secrets.WP_AUTH }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.publicar }}" = "true" ]; then
            python gerar_painel.py --publicar
          else
            python gerar_painel.py --dry-run
          fi
      - name: Commit log
        if: always()
        run: |
          git config user.name "agroclima-bot"
          git config user.email "bot@users.noreply.github.com"
          git add logs/ saida/ 2>/dev/null || true
          git commit -m "log execução $(date -u +%Y-%m-%dT%H:%MZ)" 2>/dev/null || echo "nada a commitar"
          git push 2>/dev/null || true

      - name: Issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTE=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "Painel AgroClima FALHOU" --json number -q 'length')
          if [ "$EXISTE" != "0" ]; then echo "Issue de falha já aberta — não duplicar."; exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Painel AgroClima FALHOU ($(date +%d/%m/%Y))" \
            --body "$(printf 'A geração diária do painel AgroClima falhou — o site continua mostrando a última versão publicada.\n\n**O que fazer (nesta ordem):**\n1. Actions → **diario** → Run workflow (rerodar resolve a maioria).\n2. Se falhar de novo, INMET/Open-Meteo podem estar fora do ar — espere 1h e rerode.\n3. Persistindo, acione o Claude com o link desta Issue.\n\nLogs: %s/%s/actions/runs/%s' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
