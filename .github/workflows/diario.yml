name: Painel AgroClima diário

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT (09:00 UTC) — após o dado do INMET entrar
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar no site (false = dry-run, só gera o HTML)'
        type: boolean
        default: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Gerar painel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_AUTH:           ${{ secrets.WP_AUTH }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.publicar }}" = "true" ]; then
            python gerar_painel.py --publicar
          else
            python gerar_painel.py --dry-run
          fi
      - name: Commit log
        if: always()
        run: |
          git config user.name "agroclima-bot"
          git config user.email "bot@users.noreply.github.com"
          git add logs/ saida/ 2>/dev/null || true
          git commit -m "log execução $(date -u +%Y-%m-%dT%H:%MZ)" 2>/dev/null || echo "nada a commitar"
          git push 2>/dev/null || true
